name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v
      - name: Lint the policy set
        run: python src/policy_lint.py
      - name: Validate the POA&M
        run: python src/poam_tracker.py --as-of 2026-11-15
      - name: Build the Excel tracker
        run: python src/build_tracker.py --out /tmp/tracker.xlsx
